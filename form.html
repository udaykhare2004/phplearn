<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Registration</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; }
    h2 { margin-bottom: 20px; }
    label { display: block; margin-top: 14px; font-size: 14px; font-weight: bold; }
    input[type="text"], input[type="email"], input[type="tel"],
    input[type="date"], input[type="number"], select, textarea {
      width: 100%; padding: 8px; margin-top: 4px;
      border: 1px solid #ccc; border-radius: 4px;
      font-size: 14px; box-sizing: border-box;
    }
    .option-group { margin-top: 6px; }
    .option-group label { font-weight: normal; display: inline; margin-left: 6px; }
    .option-group div { margin-bottom: 4px; }
    textarea { resize: vertical; height: 90px; }
    button { margin-top: 20px; padding: 10px 24px; background: #007bff; color: #fff; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>

  <h2>Student Registration</h2>

  <form action="process.php" method="POST">

    <label for="first_name">First Name</label>
    <input type="text" id="first_name" name="first_name" placeholder="Uday" required />

    <label for="last_name">Last Name</label>
    <input type="text" id="last_name" name="last_name" placeholder="Khare" required />

    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="uday@example.com" required />

    <label for="phone">Phone</label>
    <input type="tel" id="phone" name="phone" placeholder="+91 98765 43210" />

    <label for="dob">Date of Birth</label>
    <input type="date" id="dob" name="dob" />

    <label for="age">Age</label>
    <input type="number" id="age" name="age" min="16" max="60" placeholder="21" />

    <label for="course">Course</label>
    <select id="course" name="course" required>
      <option value="">-- Select --</option>
      <option value="php_basics">Core PHP</option>
      <option value="ci4">CodeIgniter 4</option>
      <option value="fullstack">Full Stack</option>
    </select>

    <label>Gender</label>
    <div class="option-group">
      <div><input type="radio" name="gender" value="male" required /> <label>Male</label></div>
      <div><input type="radio" name="gender" value="female" /> <label>Female</label></div>
      <div><input type="radio" name="gender" value="other" /> <label>Other</label></div>
    </div>

    <label>Interests</label>
    <div class="option-group">
      <div><input type="checkbox" name="interests[]" value="backend" /> <label>Backend</label></div>
      <div><input type="checkbox" name="interests[]" value="frontend" /> <label>Frontend</label></div>
      <div><input type="checkbox" name="interests[]" value="database" /> <label>Database</label></div>
    </div>

    <!-- <label for="about">About Yourself</label>
    <textarea id="about" name="about" placeholder="Tell us about yourself..."></textarea> -->

    <button type="submit">Submit</button>

  </form>

</body>
</html>
